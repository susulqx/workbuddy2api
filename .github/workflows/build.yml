name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache: true

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p out
          go build -trimpath -ldflags="-s -w" -o "out/wb2api${{ matrix.ext }}"     ./cmd/server
          go build -trimpath -ldflags="-s -w" -o "out/signin_bin${{ matrix.ext }}" ./cmd/signin
          go build -trimpath -ldflags="-s -w" -o "out/login${{ matrix.ext }}"      ./cmd/login
          go build -trimpath -ldflags="-s -w" -o "out/credit${{ matrix.ext }}"     ./cmd/credit
          echo "--- out ---"
          ls -l out

      - name: Smoke test (linux only)
        if: matrix.goos == 'linux'
        shell: bash
        run: ./out/wb2api -h || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wb2api-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find dist -type f -exec ls -l {} \;
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated build of \`${GITHUB_SHA}\` (windows-amd64 / linux-amd64)." \
            --target "${GITHUB_SHA}" \
            dist/**/*
